name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds and immediately verifies the bundles need nothing from node_modules.
      # This is the fast signal: without it, that class of bug only surfaces when you
      # start the packaged artifact on another machine.
      - run: npm run build

  package:
    name: ${{ matrix.label }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (arm64)
            command: pack:mac
            artifact: emqnote-macos-arm64
          - os: windows-latest
            label: Windows (x64)
            command: pack:win
            artifact: emqnote-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run icons
      - run: npm run ${{ matrix.command }}
        env:
          # No code signing. The Windows zip is deliberately an unpacked folder you can
          # start without admin rights; see 02-technisch-ontwerp.md §9.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
