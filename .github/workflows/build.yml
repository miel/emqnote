name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds and immediately verifies the bundles need nothing from node_modules.
      # This is the fast signal: without it, that class of bug only surfaces when you
      # start the packaged artifact on another machine.
      - run: npm run build

  package:
    name: ${{ matrix.label }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (arm64)
            command: pack:mac
            artifact: emqnote-macos-arm64
            glob: release/*.zip
          - os: windows-latest
            label: Windows (x64)
            command: pack:win
            artifact: emqnote-windows-x64
            # A per-user NSIS installer since B22, not a zip — see electron-builder.yml.
            glob: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite again, per platform. `check` above already ran it, on Linux — which
      # says nothing about the code that only executes somewhere else: `vault.ts` shells
      # out to `attrib` on Windows and stats block counts on macOS, `filename.ts` exists
      # for Windows' reserved names, and every path comparison in the app meets a
      # backslash for the first time here. A Files On-Demand bug shipped in v0.3.2
      # precisely because this line was missing and only `release.yml` ran the suite on
      # Windows: the failure appeared when the release was cut, not when the commit
      # landed. Cheap next to the pack step it precedes, and it fails first.
      - run: npm test

      - run: npm run icons
      - run: npm run ${{ matrix.command }}
        env:
          # No code signing. The Windows zip is deliberately an unpacked folder you can
          # start without admin rights; see 02-technisch-ontwerp.md §9.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 30
