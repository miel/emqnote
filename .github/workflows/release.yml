name: release

# Publishes a tagged version to GitHub Releases, which is what the in-app update check
# (src/main/updater.ts) reads. Tagging stays a manual step — `git tag vX.Y.Z && git push
# --tags`, after bumping package.json's version — this workflow only builds and
# publishes what a tag push asks for.
on:
  push:
    tags: ["v*"]

jobs:
  # A draft is created here, up front, rather than letting electron-builder's own
  # getOrCreateRelease do it per platform. That function lists releases, and creates one
  # if none matches the tag — and that list-then-create is not atomic. v0.2.0's first
  # publish attempt hit this twice: two matrix jobs starting at once both saw "nothing
  # yet" and each created their own release, splitting the mac and Windows assets across
  # two drafts; serializing the jobs fixed that, but then a single job's own two
  # sequential uploads (the blockmap, then the zip) raced the same way — a release
  # electron-builder had itself just created was not always visible yet to its own very
  # next list call. A *draft* release found in that list is reused immediately and
  # unconditionally (electron-builder never re-creates over an existing draft), so
  # pre-creating one here removes every "does it exist yet" race entirely: both platform
  # jobs, and every upload within them, just find it already there.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --draft --notes-from-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: ${{ matrix.label }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (arm64)
            target: --mac
          - os: windows-latest
            label: Windows (x64)
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Don't publish an untested build — the same checks build.yml runs on every push.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run icons
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code signing on either platform yet — see B22 in 05-besluitenlog.md.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  finalize-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # electron-builder always writes a blockmap and update-feed yml for the mac zip
      # target (ArchiveTarget hardcodes isWriteUpdateInfo for it — there's no config
      # knob to turn it off), but src/main/updater.ts never uses electron-updater's own
      # Squirrel.Mac path on macOS, only a plain version-check fetch. Both files are
      # genuinely dead weight on this release, unlike latest.yml and the Windows
      # .exe.blockmap, which electron-updater actually reads on the Windows path.
      - name: Remove unused mac update-feed files
        run: |
          for name in $(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -E '(-mac\.zip\.blockmap$|^latest-mac\.yml$)'); do
            gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A draft never appears from GitHub's "latest release" API, which is exactly what
      # both update paths (src/main/updater.ts) read — this is the step that actually
      # makes a release visible to them.
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
