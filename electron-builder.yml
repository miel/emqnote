appId: nl.emqnote.app
productName: emqnote
copyright: Emiel

directories:
  output: release
  buildResources: build

# Main, preload and renderer are almost all fully bundled (see electron.vite.config.ts).
# The one exception is electron-updater (package.json `dependencies`), which does
# dynamic requires that don't survive bundling — so unlike earlier, node_modules is not
# excluded wholesale here. electron-builder's default dependency walk picks up
# electron-updater and its own transitive tree from `dependencies` and ships exactly
# that, nothing from devDependencies.
files:
  - out/**/*
  - package.json

asar: true

# Chromium ships 56 locales. For one user who reads Dutch and English that is needless
# weight in a zip that travels over OneDrive to the work machine.
electronLanguages:
  - en-US
  - nl

# Update checks read the latest tagged GitHub release; see src/main/updater.ts and B22 in
# 05-besluitenlog.md. The repo has to be public for the unauthenticated check to work.
#
# Left at the default releaseType (draft) deliberately: release.yml pre-creates the
# draft itself before either platform job runs, specifically so electron-builder always
# finds and reuses it through its unconditional "it's a draft, use it" path rather than
# its list-then-create path, which is not atomic across jobs or even across one job's
# own sequential uploads. release.yml's finalize-release job un-drafts it once both
# platforms are done.
publish:
  provider: github
  owner: miel
  repo: emqnote

mac:
  category: public.app-category.productivity
  target:
    - target: zip
      arch: [arm64]
  # A menu bar app without a dock icon. Without this flag emqnote shows up in the dock
  # and the app switcher, which for a tray app is only in the way.
  extendInfo:
    LSUIElement: true
  # No Developer ID / notarization (see B22): mac stays ad-hoc signed and zip-only.
  # The update check on this platform is a plain version comparison that opens the
  # release page for a manual reinstall — it does not use electron-updater's own
  # Squirrel.Mac-based install flow, which requires real code signing.
  #
  # "-" is not optional. Without an explicit identity, and with no Developer ID
  # certificate in the CI keychain (CSC_IDENTITY_AUTO_DISCOVERY: false, no CSC_LINK
  # secret), electron-builder finds nothing and skips signing *entirely* — not even
  # ad-hoc — logging a warning easy to miss ("skipped macOS application code signing").
  # An arm64 binary with no signature at all cannot run on Apple Silicon: AMFI refuses
  # to execute it at the kernel level, which macOS surfaces as "'emqnote.app' is damaged
  # and can't be opened" — a Gatekeeper-shaped message for a problem no Gatekeeper
  # workaround (xattr, spctl, System Settings "Open Anyway") can fix, because there is no
  # signature for Gatekeeper to evaluate trust of in the first place. "-" forces the
  # ad-hoc signature that makes the binary launchable; it is not the same as, and does
  # not require, a real Developer ID.
  identity: "-"

win:
  # Per-user NSIS install: no admin rights required, same as unzipping a folder is
  # today, so this is not "an extra hurdle" the way a per-machine installer would be.
  # See B22 in 05-besluitenlog.md, which revisits the original no-installer decision in
  # 02-technisch-ontwerp.md §9.
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target: []
