appId: nl.emqnote.app
productName: emqnote
copyright: Emiel

directories:
  output: release
  buildResources: build

# Main, preload and renderer are all fully bundled (see electron.vite.config.ts), so
# nothing from node_modules is needed at runtime. electron-builder would otherwise pull
# the production dependencies in anyway; excluding them saves around 10 MB of dead
# weight here.
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"

asar: true

# Chromium ships 56 locales. For one user who reads Dutch and English that is needless
# weight in a zip that travels over OneDrive to the work machine.
electronLanguages:
  - en-US
  - nl

mac:
  category: public.app-category.productivity
  target:
    - target: zip
      arch: [arm64]
  # A menu bar app without a dock icon. Without this flag emqnote shows up in the dock
  # and the app switcher, which for a tray app is only in the way.
  extendInfo:
    LSUIElement: true

win:
  # Deliberately no installer. Without admin rights an installer is just another
  # hurdle; an unpacked folder you start from OneDrive is the least vulnerable to
  # corporate policy. See 02-technisch-ontwerp.md §9.
  target:
    - target: zip
      arch: [x64]

linux:
  target: []
